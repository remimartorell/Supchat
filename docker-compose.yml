version: '3.8'

services:
  backend:
    build:
      context: ./supchat-backend
    ports:
      - "3000:3000"
    volumes:
      - ./supchat-backend:/app
      - /app/node_modules
    environment:
      - MONGO_URI=mongodb://mongodb:27017/supchat
    depends_on:
      - mongodb

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:

    # Comande Docker "docker-compose up --build"