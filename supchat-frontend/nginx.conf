# supchat-frontend/default.conf
upstream supchat-backend {
    server supchat-backend:3000;
}

server {
    listen       80;
    server_name  192.168.5.180;

    root   /usr/share/nginx/html;
    index  index.html;

    # WebSocket / Socket.IO
    location /socket.io/ {
        proxy_pass             http://supchat-backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host $host;
        # évite que nginx ferme la connexion trop tôt
        proxy_read_timeout     86400s;
    }

    # API REST / Auth
    location ~ ^/(api|auth)/ {
        proxy_pass         http://supchat-backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Toutes les autres requêtes, on sert index.html (SPA)
    location / {
        try_files $uri /index.html;
    }
}
